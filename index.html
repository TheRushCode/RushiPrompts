<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RushiPrompts — A curated gallery of AI image generation prompts with cinematic, luxury, and editorial aesthetics." />

  <title>RushiPrompts</title>

  <!-- DNS PREFETCH for Google Fonts -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- FONT (font-display=swap prevents render-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

  <!-- PRELOAD profile image — used on every card -->
  <link rel="preload" as="image" href="images/webp/profile.webp" type="image/webp" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">RushiPrompts</div>
    <div class="nav-links">
      <a href="#">Feed</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Prompt Gallery</h1>
    <p>Search creators, prompts and styles</p>
    <input type="text" id="searchInput" placeholder="Search prompts..." autocomplete="off" />
  </section>

  <!-- GALLERY (populated by app.js) -->
  <section class="gallery" id="gallery"></section>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite">Prompt Copied!</div>

  <!-- JS (defer = non-blocking, runs after HTML is parsed) -->
  <script src="js/app.js" defer></script>

</body>
</html>
